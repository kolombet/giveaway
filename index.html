<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Free items to give away. Call to ask what's available.">
  <title>Giveaway</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #e9eee0;
      color: #21392f;
      font: 1.125rem/1.55 system-ui, sans-serif;
    }
    main {
      width: min(100%, 44rem);
      padding: clamp(2rem, 8vw, 5rem);
      border: 1px solid #a4ad98;
      border-radius: 1rem;
      background: #faf8ef;
    }
    h1 {
      margin: 0;
      font: 500 clamp(3rem, 12vw, 6rem)/1 Georgia, serif;
      letter-spacing: -.055em;
    }
    p { max-width: 27ch; margin: 1.25rem 0 1.75rem; }
    a {
      display: inline-block;
      padding: .75rem 1rem;
      border-radius: .4rem;
      background: #21392f;
      color: #fff;
      font-weight: 650;
      text-decoration: none;
    }
    a:hover { background: #38594a; }
    a:focus-visible { outline: 3px solid #38594a; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Giveaway</h1>
    <p>Items are free. Call to ask what’s available.</p>
    <a href="tel:+4540769699">Call +45 40 76 96 99</a>
  </main>
</body>
</html>
